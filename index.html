<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器学习方法性能比较</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #34495e;
            font-size: 0.9rem;
        }
        
        select {
            padding: 10px 15px;
            border: 1px solid #dce1e6;
            border-radius: 8px;
            background: white;
            font-size: 1rem;
            min-width: 180px;
            transition: all 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .chart-container {
            position: relative;
            height: 500px;
            margin-bottom: 30px;
            overflow: visible;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .tooltip {
            position: absolute;
            padding: 12px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            font-size: 0.9rem;
            max-width: 300px;
        }
        
        .tooltip h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 1rem;
        }
        
        .tooltip p {
            margin: 4px 0;
            color: #34495e;
        }
        
        .axis-label {
            font-size: 1rem;
            fill: #34495e;
            font-weight: 500;
        }
        
        .bar {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .bar:hover {
            opacity: 0.8;
            filter: brightness(1.1);
        }
        
        .view-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .toggle-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #dce1e6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .toggle-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .chart-container {
                height: 400px;
            }
            
            .legend {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>机器学习方法性能比较</h1>
            <p class="subtitle">不同方法在多个数据集上的标准准确率、认证鲁棒性率和认证鲁棒准确率</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="dataset-select">选择数据集</label>
                <select id="dataset-select">
                    <option value="CIFAR100">CIFAR-100</option>
                    <option value="CIFAR10">CIFAR-10</option>
                    <option value="SVHN">SVHN</option>
                    <option value="MNIST">MNIST</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="metric-select">选择指标</label>
                <select id="metric-select">
                    <option value="Std_Acc">标准准确率</option>
                    <option value="CRR">认证鲁棒性率</option>
                    <option value="CRA">认证鲁棒准确率</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>视图模式</label>
                <div class="view-toggle">
                    <button id="single-view" class="toggle-btn active">单指标视图</button>
                    <button id="multi-view" class="toggle-btn">多指标视图</button>
                </div>
            </div>
        </div>
        
        <div class="chart-container">
            <div id="tooltip" class="tooltip"></div>
            <!-- 图表将通过D3.js动态生成 -->
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4e79a7;"></div>
                <span>标准准确率</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #f28e2b;"></div>
                <span>认证鲁棒性率</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #e15759;"></div>
                <span>认证鲁棒准确率</span>
            </div>
        </div>
    </div>

    <script>
        // 数据定义
        const data = [
            {
                "Approach": "ERM",
                "CIFAR100": { "Std_Acc": 81.03, "CRR": 9.28, "CRA": 4.52 },
                "CIFAR10": { "Std_Acc": 94.85, "CRR": 1.25, "CRA": 1.25 },
                "SVHN": { "Std_Acc": 94.44, "CRR": 52.72, "CRA": 51.04 },
                "MNIST": { "Std_Acc": 99.37, "CRR": 26.01, "CRA": 24.96 }
            },
            {
                "Approach": "DA",
                "CIFAR100": { "Std_Acc": 78.27, "CRR": 15.04, "CRA": 6.15 },
                "CIFAR10": { "Std_Acc": 94.21, "CRR": 81.08, "CRA": 76.07 },
                "SVHN": { "Std_Acc": 94.69, "CRR": 82.08, "CRA": 82.01 },
                "MNIST": { "Std_Acc": 99.42, "CRR": 85.23, "CRA": 84.12 }
            },
            {
                "Approach": "PGDT",
                "CIFAR100": { "Std_Acc": 64.35, "CRR": 57.07, "CRA": 32.93 },
                "CIFAR10": { "Std_Acc": 84.38, "CRR": 87.07, "CRA": 82.90 },
                "SVHN": { "Std_Acc": 91.19, "CRR": 87.89, "CRA": 86.68 },
                "MNIST": { "Std_Acc": 99.16, "CRR": 94.65, "CRA": 94.63 }
            },
            {
                "Approach": "TRADES",
                "CIFAR100": { "Std_Acc": 62.55, "CRR": 59.27, "CRA": 38.85 },
                "CIFAR10": { "Std_Acc": 80.42, "CRR": 88.54, "CRA": 78.80 },
                "SVHN": { "Std_Acc": 86.16, "CRR": 87.89, "CRA": 84.76 },
                "MNIST": { "Std_Acc": 99.10, "CRR": 94.76, "CRA": 94.61 }
            },
            {
                "Approach": "MART",
                "CIFAR100": { "Std_Acc": 63.68, "CRR": 58.79, "CRA": 49.37 },
                "CIFAR10": { "Std_Acc": 81.54, "CRR": 78.90, "CRA": 72.21 },
                "SVHN": { "Std_Acc": 90.20, "CRR": 85.23, "CRA": 78.82 },
                "MNIST": { "Std_Acc": 98.94, "CRR": 94.13, "CRA": 94.09 }
            },
            {
                "Approach": "RS",
                "CIFAR100": { "Std_Acc": 56.87, "CRR": 60.38, "CRA": 47.50 },
                "CIFAR10": { "Std_Acc": 89.45, "CRR": 90.00, "CRA": 87.98 },
                "SVHN": { "Std_Acc": 88.35, "CRR": 76.29, "CRA": 70.64 },
                "MNIST": { "Std_Acc": 97.16, "CRR": 87.15, "CRA": 86.29 }
            },
            {
                "Approach": "IBP",
                "CIFAR100": { "Std_Acc": 39.45, "CRR": 49.34, "CRA": 29.20 },
                "CIFAR10": { "Std_Acc": 48.40, "CRR": 54.70, "CRA": 40.00 },
                "SVHN": { "Std_Acc": 73.09, "CRR": 61.94, "CRA": 57.26 },
                "MNIST": { "Std_Acc": 97.78, "CRR": 89.18, "CRA": 88.51 }
            },
            {
                "Approach": "PRL",
                "CIFAR100": { "Std_Acc": 64.89, "CRR": 56.71, "CRA": 50.77 },
                "CIFAR10": { "Std_Acc": 93.82, "CRR": 90.71, "CRA": 90.63 },
                "SVHN": { "Std_Acc": 92.00, "CRR": 93.11, "CRA": 91.07 },
                "MNIST": { "Std_Acc": 99.32, "CRR": 96.03, "CRA": 95.01 }
            },
            {
                "Approach": "TandT",
                "CIFAR100": { "Std_Acc": 65.56, "CRR": 62.05, "CRA": 52.07 },
                "CIFAR10": { "Std_Acc": 94.23, "CRR": 95.08, "CRA": 91.75 },
                "SVHN": { "Std_Acc": 94.79, "CRR": 93.15, "CRA": 92.81 },
                "MNIST": { "Std_Acc": 99.32, "CRR": 97.80, "CRA": 96.80 }
            }
        ];

        // 颜色方案
        const colorScale = d3.scaleOrdinal()
            .domain(["Std_Acc", "CRR", "CRA"])
            .range(["#4e79a7", "#f28e2b", "#e15759"]);

        // 指标名称映射
        const metricNames = {
            "Std_Acc": "标准准确率",
            "CRR": "认证鲁棒性率", 
            "CRA": "认证鲁棒准确率"
        };

        // 数据集名称映射
        const datasetNames = {
            "CIFAR100": "CIFAR-100",
            "CIFAR10": "CIFAR-10", 
            "SVHN": "SVHN",
            "MNIST": "MNIST"
        };

        // 初始化变量
        let currentDataset = "CIFAR100";
        let currentMetric = "Std_Acc";
        let isMultiView = false;

        // 创建SVG
        const margin = { top: 40, right: 30, bottom: 80, left: 60 };
        const width = 800 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        const svg = d3.select(".chart-container")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // 创建比例尺
        const xScale = d3.scaleBand()
            .range([0, width])
            .padding(0.2);

        const yScale = d3.scaleLinear()
            .range([height, 0])
            .domain([0, 100]);

        // 创建坐标轴
        const xAxis = d3.axisBottom(xScale);
        const yAxis = d3.axisLeft(yScale).ticks(10).tickFormat(d => d + "%");

        // 添加坐标轴
        svg.append("g")
            .attr("class", "x-axis")
            .attr("transform", `translate(0,${height})`);

        svg.append("g")
            .attr("class", "y-axis");

        // 添加坐标轴标签
        svg.append("text")
            .attr("class", "axis-label")
            .attr("transform", "rotate(-90)")
            .attr("y", 0 - margin.left)
            .attr("x", 0 - (height / 2))
            .attr("dy", "1em")
            .style("text-anchor", "middle")
            .text("准确率 (%)");

        svg.append("text")
            .attr("class", "axis-label")
            .attr("transform", `translate(${width / 2}, ${height + margin.bottom - 10})`)
            .style("text-anchor", "middle")
            .text("机器学习方法");

        // 创建工具提示
        const tooltip = d3.select("#tooltip");

        // 更新图表函数
        function updateChart() {
            // 更新数据
            let chartData;
            if (isMultiView) {
                // 多指标视图 - 显示所有三个指标
                chartData = data.map(d => ({
                    Approach: d.Approach,
                    values: [
                        { metric: "Std_Acc", value: d[currentDataset].Std_Acc },
                        { metric: "CRR", value: d[currentDataset].CRR },
                        { metric: "CRA", value: d[currentDataset].CRA }
                    ]
                }));
            } else {
                // 单指标视图 - 只显示选定的指标
                chartData = data.map(d => ({
                    Approach: d.Approach,
                    value: d[currentDataset][currentMetric]
                }));
            }

            // 更新x轴比例尺
            xScale.domain(chartData.map(d => d.Approach));

            // 更新y轴比例尺
            if (isMultiView) {
                yScale.domain([0, 100]);
            } else {
                const maxValue = d3.max(chartData, d => d.value);
                yScale.domain([0, Math.max(maxValue * 1.1, 10)]);
            }

            // 更新坐标轴
            svg.select(".x-axis")
                .transition()
                .duration(750)
                .call(xAxis);

            svg.select(".y-axis")
                .transition()
                .duration(750)
                .call(yAxis);

            // 处理柱状图
            if (isMultiView) {
                // 多指标视图
                const metricGroups = svg.selectAll(".metric-group")
                    .data(chartData, d => d.Approach);

                // 进入
                const metricGroupsEnter = metricGroups.enter()
                    .append("g")
                    .attr("class", "metric-group")
                    .attr("transform", d => `translate(${xScale(d.Approach)}, 0)`);

                // 更新
                metricGroups.merge(metricGroupsEnter)
                    .transition()
                    .duration(750)
                    .attr("transform", d => `translate(${xScale(d.Approach)}, 0)`);

                // 退出
                metricGroups.exit()
                    .transition()
                    .duration(750)
                    .style("opacity", 0)
                    .remove();

                // 处理每个指标的柱子
                const bars = metricGroups.merge(metricGroupsEnter)
                    .selectAll(".bar")
                    .data(d => d.values, (d, i) => d.metric);

                // 进入
                bars.enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", (d, i) => i * (xScale.bandwidth() / 3))
                    .attr("width", xScale.bandwidth() / 3 - 2)
                    .attr("y", height)
                    .attr("height", 0)
                    .attr("fill", d => colorScale(d.metric))
                    .on("mouseover", function(event, d) {
                        const approach = d3.select(this.parentNode).datum().Approach;
                        tooltip.transition()
                            .duration(200)
                            .style("opacity", 0.95);
                        tooltip.html(`
                            <h3>${approach}</h3>
                            <p><strong>${metricNames[d.metric]}:</strong> ${d.value}%</p>
                            <p><strong>数据集:</strong> ${datasetNames[currentDataset]}</p>
                        `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    })
                    .transition()
                    .duration(750)
                    .delay((d, i) => i * 100)
                    .attr("y", d => yScale(d.value))
                    .attr("height", d => height - yScale(d.value));

                // 更新
                bars.transition()
                    .duration(750)
                    .delay((d, i) => i * 100)
                    .attr("x", (d, i) => i * (xScale.bandwidth() / 3))
                    .attr("width", xScale.bandwidth() / 3 - 2)
                    .attr("y", d => yScale(d.value))
                    .attr("height", d => height - yScale(d.value))
                    .attr("fill", d => colorScale(d.metric));

                // 退出
                bars.exit()
                    .transition()
                    .duration(750)
                    .style("opacity", 0)
                    .remove();

            } else {
                // 单指标视图
                const bars = svg.selectAll(".bar")
                    .data(chartData, d => d.Approach);

                // 进入
                bars.enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", d => xScale(d.Approach))
                    .attr("width", xScale.bandwidth())
                    .attr("y", height)
                    .attr("height", 0)
                    .attr("fill", colorScale(currentMetric))
                    .on("mouseover", function(event, d) {
                        tooltip.transition()
                            .duration(200)
                            .style("opacity", 0.95);
                        tooltip.html(`
                            <h3>${d.Approach}</h3>
                            <p><strong>${metricNames[currentMetric]}:</strong> ${d.value}%</p>
                            <p><strong>数据集:</strong> ${datasetNames[currentDataset]}</p>
                        `)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    })
                    .transition()
                    .duration(750)
                    .delay((d, i) => i * 100)
                    .attr("y", d => yScale(d.value))
                    .attr("height", d => height - yScale(d.value));

                // 更新
                bars.transition()
                    .duration(750)
                    .delay((d, i) => i * 100)
                    .attr("x", d => xScale(d.Approach))
                    .attr("width", xScale.bandwidth())
                    .attr("y", d => yScale(d.value))
                    .attr("height", d => height - yScale(d.value))
                    .attr("fill", colorScale(currentMetric));

                // 退出
                bars.exit()
                    .transition()
                    .duration(750)
                    .style("opacity", 0)
                    .remove();
            }
        }

        // 初始化图表
        updateChart();

        // 添加事件监听器
        document.getElementById("dataset-select").addEventListener("change", function() {
            currentDataset = this.value;
            updateChart();
        });

        document.getElementById("metric-select").addEventListener("change", function() {
            currentMetric = this.value;
            updateChart();
        });

        document.getElementById("single-view").addEventListener("click", function() {
            if (isMultiView) {
                isMultiView = false;
                document.getElementById("single-view").classList.add("active");
                document.getElementById("multi-view").classList.remove("active");
                document.getElementById("metric-select").disabled = false;
                updateChart();
            }
        });

        document.getElementById("multi-view").addEventListener("click", function() {
            if (!isMultiView) {
                isMultiView = true;
                document.getElementById("multi-view").classList.add("active");
                document.getElementById("single-view").classList.remove("active");
                document.getElementById("metric-select").disabled = true;
                updateChart();
            }
        });
    </script>
</body>
</html>
